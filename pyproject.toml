[project]
name = "restructuredtext-docs"
version = "0.1.0"
description = "Documentation site for reStructuredText"
authors = [
  { name = "LeXtudio Inc.", email = "support@lextudio.com" }
]
readme = "README.md"
requires-python = ">=3.13"

# Runtime dependencies (was Pipfile [packages])
dependencies = [
  "sphinx",
  "sphinx-copybutton",
  "sphinx-sitemap-lextudio",
  "sphinx-notfound-page",
  "furo"
]

# This project is a documentation site; no build backend needed for distribution.
